<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card-shell">
<div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:14px">
  <div style="border:1px solid var(--border); padding:18px; display:flex; flex-direction:column; align-items:center; gap:12px">
    <div style="width:56px; height:56px; background:var(--green)"></div>
    <div style="text-align:center">
      <div style="font-weight:600; font-size:13px">Default</div>
      <div class="mono">0px · everything</div>
    </div>
  </div>
  <div style="border:1px solid var(--border); padding:18px; display:flex; flex-direction:column; align-items:center; gap:12px">
    <div style="width:32px; height:32px; border-radius:50%; border:1.5px solid var(--berry); position:relative">
      <div style="position:absolute; inset:18%; background:var(--berry); border-radius:50%"></div>
    </div>
    <div style="text-align:center">
      <div style="font-weight:600; font-size:13px">Berry</div>
      <div class="mono">50% · bullet only</div>
    </div>
  </div>
  <div style="border:1px solid var(--border); padding:18px; display:flex; flex-direction:column; align-items:center; gap:12px">
    <div style="width:80px; height:26px; background:var(--bar-search); border:1px solid var(--border); border-radius:999px"></div>
    <div style="text-align:center">
      <div style="font-weight:600; font-size:13px">Pill</div>
      <div class="mono">999px · filter chips</div>
    </div>
  </div>
</div>
<p style="font-size:12px;color:var(--fg-muted);margin:0;line-height:1.5;max-width:60ch"><strong>Square. Always.</strong> Twiglit reads as ink on paper, not an interface. Two exceptions exist, each earned for one reason: the berry is the brand, and filter chips are earned.</p>
</div>
</body></html>
