<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card-shell" style="gap:0">
<div style="display:flex;align-items:center;gap:14px;padding:4px 0;border-bottom:1px dashed var(--border)">
  <span class="mono" style="flex:0 0 90px">--space-1</span><div style="width:4px;height:10px;background:var(--green)"></div><span class="mono" style="margin-left:auto">4px</span>
</div>
<div style="display:flex;align-items:center;gap:14px;padding:4px 0;border-bottom:1px dashed var(--border)">
  <span class="mono" style="flex:0 0 90px">--space-2</span><div style="width:8px;height:10px;background:var(--green)"></div><span class="mono" style="margin-left:auto">8px</span>
</div>
<div style="display:flex;align-items:center;gap:14px;padding:4px 0;border-bottom:1px dashed var(--border)">
  <span class="mono" style="flex:0 0 90px">--space-3</span><div style="width:12px;height:10px;background:var(--green)"></div><span class="mono" style="margin-left:auto">12px</span>
</div>
<div style="display:flex;align-items:center;gap:14px;padding:4px 0;border-bottom:1px dashed var(--border)">
  <span class="mono" style="flex:0 0 90px">--space-4</span><div style="width:16px;height:10px;background:var(--green)"></div><span class="mono" style="margin-left:auto">16px</span>
</div>
<div style="display:flex;align-items:center;gap:14px;padding:4px 0;border-bottom:1px dashed var(--border)">
  <span class="mono" style="flex:0 0 90px">--space-5</span><div style="width:20px;height:10px;background:var(--green)"></div><span class="mono" style="margin-left:auto">20px</span>
</div>
<div style="display:flex;align-items:center;gap:14px;padding:4px 0;border-bottom:1px dashed var(--border)">
  <span class="mono" style="flex:0 0 90px">--space-6</span><div style="width:24px;height:10px;background:var(--green)"></div><span class="mono" style="margin-left:auto">24px</span>
</div>
<div style="display:flex;align-items:center;gap:14px;padding:4px 0;border-bottom:1px dashed var(--border)">
  <span class="mono" style="flex:0 0 90px">--space-7</span><div style="width:32px;height:10px;background:var(--green)"></div><span class="mono" style="margin-left:auto">32px</span>
</div>
<div style="display:flex;align-items:center;gap:14px;padding:4px 0;border-bottom:1px dashed var(--border)">
  <span class="mono" style="flex:0 0 90px">--space-8</span><div style="width:40px;height:10px;background:var(--green)"></div><span class="mono" style="margin-left:auto">40px</span>
</div>
<div style="display:flex;align-items:center;gap:14px;padding:4px 0;border-bottom:1px dashed var(--border)">
  <span class="mono" style="flex:0 0 90px">--space-9</span><div style="width:56px;height:10px;background:var(--green)"></div><span class="mono" style="margin-left:auto">56px</span>
</div>
<div style="display:flex;align-items:center;gap:14px;padding:4px 0">
  <span class="mono" style="flex:0 0 90px">--space-10</span><div style="width:72px;height:10px;background:var(--green)"></div><span class="mono" style="margin-left:auto">72px</span>
</div>
<p style="font-size:12px;color:var(--fg-muted);margin:14px 0 0;line-height:1.5;max-width:60ch">4-point rhythm. The tree is dense — most internal gaps live in <span class="mono" style="color:var(--fg-muted)">--space-2</span> to <span class="mono" style="color:var(--fg-muted)">--space-4</span>.</p>
</div>
</body></html>
