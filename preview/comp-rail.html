<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/system.css">
<link rel="stylesheet" href="_card.css"></head><body>
<div class="card-shell">
<div style="display:flex; gap:18px; align-items:flex-start">
  <div style="background:var(--ink); width:56px; display:flex; flex-direction:column;">
    <div class="rail-pin brand" style="width:56px; height:56px; padding:8px"><img src="../assets/brand/app-icon.png" alt="" style="width:36px;height:36px"></div>
    <div class="rail-pin active" style="width:56px; height:42px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="4" cy="7" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="17" r="1"/><path d="M9 7h12M9 12h12M9 17h12"/></svg></div>
    <div class="rail-pin" style="width:56px; height:42px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></div>
    <div class="rail-pin" style="width:56px; height:42px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-12 6.93L4 20l1.07-5A8 8 0 1 1 21 12z"/></svg></div>
    <div class="rail-pin" style="width:56px; height:42px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="10" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg></div>
  </div>
  <div style="flex:1">
    <p style="margin:0 0 12px;font-size:13px;line-height:1.55;color:var(--fg)"><strong>The ink rail.</strong> 64px wide, fixed to the edge, hosts the per-app icons and the brand mark. Active pin gains a 3px <span class="mono" style="color:var(--fg-muted)">--green</span> stripe on the left edge.</p>
    <ul style="margin:0; padding-left:18px; font-size:12px; color:var(--fg-muted); line-height:1.7">
      <li>Idle icons: <span class="mono" style="color:var(--fg-muted)">--ink-icon</span> (#9b9b9b)</li>
      <li>Hover: <span class="mono" style="color:var(--fg-muted)">rgba(255,255,255,0.3)</span> wash</li>
      <li>Brand pin (top): 40px logo on green</li>
    </ul>
  </div>
</div>
</div>
</body></html>
