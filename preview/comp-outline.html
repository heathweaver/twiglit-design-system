<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/system.css">
<link rel="stylesheet" href="_card.css"></head><body>
<div class="card-shell">
<div class="outline" style="font-size:13px">
  <div class="outline-row outline-line">
    <span class="berry-folder is-open is-focused"></span>
    <span class="outline-text"><strong>Weekly planning</strong></span>
  </div>
  <div class="outline-row outline-line outline-indent">
    <span class="berry"></span>
    <span class="outline-text">Draft launch announcement</span>
  </div>
  <div class="outline-row outline-line outline-indent selected">
    <span class="berry is-checked"></span>
    <span class="outline-text">Ship four-bar header to the app <strong>← selected</strong></span>
  </div>
  <div class="outline-row outline-line outline-indent">
    <span class="berry is-shared is-checked"></span>
    <span class="outline-text">Coffee with Mira <span class="outline-meta">· shared</span></span>
  </div>
  <div class="outline-row outline-line outline-indent">
    <span class="berry"></span>
    <span class="outline-text">Sync notes from twigl</span>
  </div>
</div>
<p style="font-size:11px;color:var(--fg-muted);margin:0;line-height:1.5"><strong>The tree.</strong> Dense rows, berry on the left, no vertical indent lines. Selected row gets <span class="mono" style="color:var(--fg-muted)">--bar-selected</span> with a full-bleed pseudo background extending edge-to-edge.</p>
</div>
</body></html>
