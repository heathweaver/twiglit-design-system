<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card-shell">
<div style="display:flex; align-items:center; gap:36px; padding:14px 0">
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px">
    <div style="width:88px; height:88px; background:var(--green); display:grid; place-items:center; position:relative; overflow:hidden">
      <img src="../assets/brand/app-icon.png" alt="" style="width:88px;height:88px;display:block">
    </div>
    <span class="mono">app-icon · 1024²</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px">
    <img src="../assets/brand/chat-icon.png" alt="" style="width:64px;height:64px;display:block">
    <span class="mono">chat-icon</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px">
    <img src="../assets/brand/favicon.png" alt="" style="width:32px;height:32px;display:block">
    <span class="mono">favicon · 310²</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px">
    <div style="width:32px;height:32px;border-radius:50%;background:var(--berry);color:white;display:grid;place-items:center;font-weight:600;font-size:13px">H</div>
    <span class="mono">avatar · fallback</span>
  </div>
</div>
<p style="font-size:11px;color:var(--fg-muted);margin:0;line-height:1.5;max-width:60ch">The app icon is a stylized white plant on <span class="mono" style="color:var(--fg-muted)">--green</span> with a 45° long shadow — the only "illustrated" mark. The chat icon reuses the long-shadow treatment in a circle. Avatar fallback is initials on <span class="mono" style="color:var(--fg-muted)">--berry</span>.</p>
</div>
</body></html>
