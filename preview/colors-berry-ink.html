<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card-shell">
<div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:0; border:1px solid var(--border)">
  <div style="padding:18px 16px; min-height:120px; display:flex; flex-direction:column; justify-content:space-between; background:var(--berry); color:white; border-right:1px solid rgba(0,0,0,.08)">
    <span style="font-size:11px; opacity:.8; letter-spacing:.14em; text-transform:uppercase; font-family:var(--font-mono)">Bullet · avatar</span>
    <div><div style="font-weight:600;font-size:13px">Berry</div><div style="font-family:var(--font-mono); font-size:10px; opacity:.8; letter-spacing:.04em">#b86b6a · --berry</div></div>
  </div>
  <div style="padding:18px 16px; min-height:120px; display:flex; flex-direction:column; justify-content:space-between; background:var(--berry-soft); color:var(--berry-deep); border-right:1px solid rgba(0,0,0,.08)">
    <span style="font-size:11px; opacity:.7; letter-spacing:.14em; text-transform:uppercase; font-family:var(--font-mono)">Attention · lock</span>
    <div><div style="font-weight:600;font-size:13px">Berry soft</div><div style="font-family:var(--font-mono); font-size:10px; opacity:.8; letter-spacing:.04em">#f1dcdb · --berry-soft</div></div>
  </div>
  <div style="padding:18px 16px; min-height:120px; display:flex; flex-direction:column; justify-content:space-between; background:var(--ink); color:white;">
    <span style="font-size:11px; opacity:.8; letter-spacing:.14em; text-transform:uppercase; font-family:var(--font-mono)">Rail · mobile pill</span>
    <div><div style="font-weight:600;font-size:13px">Ink</div><div style="font-family:var(--font-mono); font-size:10px; opacity:.8; letter-spacing:.04em">#40404a · --ink</div></div>
  </div>
</div>
<p style="font-size:12px;color:var(--fg-muted);margin:0;line-height:1.5;max-width:60ch"><strong>Berry</strong> is the bullet color and the avatar fallback — never a UI background. <strong>Ink</strong> is the right rail and the mobile pill — never a body background.</p>
</div>
</body></html>
