<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card-shell">
<div style="display:grid; grid-template-columns: 56px 1fr auto; gap:14px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-faint)">
  <div style="width:42px;height:26px;background:var(--fg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>
  <div><div style="font-weight:600;font-size:13px">Foreground</div><div style="color:var(--fg-muted);font-size:11px">body text, breadcrumbs</div></div>
  <span class="mono" style="font-size:11px">--fg · #333</span>
</div>
<div style="display:grid; grid-template-columns: 56px 1fr auto; gap:14px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-faint)">
  <div style="width:42px;height:26px;background:var(--fg-muted);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>
  <div><div style="font-weight:600;font-size:13px">Muted</div><div style="color:var(--fg-muted);font-size:11px">secondary text, supportive labels</div></div>
  <span class="mono" style="font-size:11px">--fg-muted · #666</span>
</div>
<div style="display:grid; grid-template-columns: 56px 1fr auto; gap:14px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-faint)">
  <div style="width:42px;height:26px;background:var(--fg-subtle);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>
  <div><div style="font-weight:600;font-size:13px">Subtle</div><div style="color:var(--fg-muted);font-size:11px">meta, timestamps, mono labels</div></div>
  <span class="mono" style="font-size:11px">--fg-subtle · #999</span>
</div>
<div style="display:grid; grid-template-columns: 56px 1fr auto; gap:14px; align-items:center; padding:10px 0">
  <div style="width:42px;height:26px;background:var(--fg-faint);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)"></div>
  <div><div style="font-weight:600;font-size:13px">Faint</div><div style="color:var(--fg-muted);font-size:11px">placeholder, disabled</div></div>
  <span class="mono" style="font-size:11px">--fg-faint · #c0c0c0</span>
</div>
</div>
</body></html>
