<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card-shell" style="gap:0">
<div style="display:grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; border:1px solid var(--border)">
  <div style="background:var(--bg); padding:14px; min-height:90px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--border)">
    <span class="eyebrow">Body</span>
    <div><div style="font-size:13px;font-weight:600">--bg</div><div class="mono">#ffffff</div></div>
  </div>
  <div style="background:var(--bar-search); padding:14px; min-height:90px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--border)">
    <span class="eyebrow">Bar 1 · search</span>
    <div><div style="font-size:13px;font-weight:600">--bar-search</div><div class="mono">#f2f2f2</div></div>
  </div>
  <div style="background:var(--bar-location); padding:14px; min-height:90px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--border)">
    <span class="eyebrow">Bar 2 · location</span>
    <div><div style="font-size:13px;font-weight:600">--bar-location</div><div class="mono">#e9e9e9</div></div>
  </div>
  <div style="background:var(--bar-action); padding:14px; min-height:90px; display:flex; flex-direction:column; justify-content:space-between; border-right:1px solid var(--border)">
    <span class="eyebrow">Bar 3 · action</span>
    <div><div style="font-size:13px;font-weight:600">--bar-action</div><div class="mono">#d7d7d7</div></div>
  </div>
  <div style="background:var(--bar-selected); padding:14px; min-height:90px; display:flex; flex-direction:column; justify-content:space-between;">
    <span class="eyebrow">Bar 4 · selected</span>
    <div><div style="font-size:13px;font-weight:600">--bar-selected</div><div class="mono">#f0f0f0</div></div>
  </div>
</div>
<p style="font-size:12px;color:var(--fg-muted);margin:14px 0 0;line-height:1.5;max-width:60ch">The four-bar vocabulary. Top-down: <strong>who</strong> → <strong>where</strong> → <strong>what</strong> → <strong>selected</strong>. The body is white because everything else is grey.</p>
</div>
</body></html>
