<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card-shell">
<div style="display:grid; grid-template-columns: repeat(8, 1fr); gap:6px">
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 11l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">home</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">calendar</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="4" cy="6" r="1.5" fill="currentColor" stroke="none"/><line x1="9" y1="6" x2="21" y2="6"/><circle cx="9" cy="12" r="1.5" fill="currentColor" stroke="none"/><line x1="14" y1="12" x2="21" y2="12"/><circle cx="9" cy="18" r="1.5" fill="currentColor" stroke="none"/><line x1="14" y1="18" x2="21" y2="18"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">tree</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">search</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M21 12a8 8 0 0 1-12 6.93L4 20l1.07-5A8 8 0 1 1 21 12z"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">chat</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">focus</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="14 3 14 9 20 9"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">details</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="4" y="4" width="16" height="16"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">complete</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 7h16M9 7V4h6v3M6 7v13a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">delete</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="11 17 6 12 11 7"/><line x1="6" y1="12" x2="19" y2="12"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">outdent</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="13 17 18 12 13 7"/><line x1="18" y1="12" x2="5" y2="12"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">indent</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">plus</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M6 4h12a1 1 0 0 1 1 1v16l-7-4-7 4V5a1 1 0 0 1 1-1z"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">bookmark</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 4h18l-7 9v6l-4 2v-8z"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">filter</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="10" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 20c0-2.2 1.8-4 4-4s4 1.8 4 4"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">team</span>
  </div>
  <div style="border:1px solid var(--border); padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.2-1.7l2-1.5-2-3.4-2.3 1a7 7 0 0 0-3-1.7L13 3h-2l-.5 1.7a7 7 0 0 0-3 1.7l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .6.1 1.1.2 1.7l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 3 1.7L11 21h2l.5-1.7a7 7 0 0 0 3-1.7l2.3 1 2-3.4-2-1.5c.1-.6.2-1.1.2-1.7z"/></svg>
    <span style="font-size:9.5px;color:var(--fg-muted)">settings</span>
  </div>
</div>
<p style="font-size:11px;color:var(--fg-muted);margin:0;line-height:1.5"><strong>Phosphor-Regular-style placeholder set.</strong> 1.5–1.75px stroke, rounded caps + joins. <span class="mono" style="color:var(--fg-muted)">currentColor</span> inheritance. No icon-only buttons when actionable — always paired with a label.</p>
</div>
</body></html>
