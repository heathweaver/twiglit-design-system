<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/system.css">
<link rel="stylesheet" href="_card.css"></head><body>
<div class="card-shell">
<div class="row" style="gap:8px; flex-wrap:wrap">
  <span class="chip">All</span>
  <span class="chip active">Today</span>
  <span class="chip">This week</span>
  <span class="chip">Pinned</span>
  <span class="chip">Shared</span>
</div>
<div class="row" style="gap:8px; flex-wrap:wrap">
  <span class="badge">draft</span>
  <span class="badge badge-green">approved</span>
  <span class="badge badge-berry">await</span>
  <span class="badge">12</span>
</div>
<p style="font-size:11px;color:var(--fg-muted);margin:0;line-height:1.5"><strong>Chips are pill-shaped (999px) — the only earned-radius shape besides the berry.</strong> Badges are square and used sparingly; "approved" = green-soft, "await" = berry-soft.</p>
</div>
</body></html>
