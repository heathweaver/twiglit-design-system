<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Twiglit iOS — UI kit</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="../../assets/brand/favicon.png" />
<link rel="stylesheet" href="../../assets/css/tokens.css" />
<style>
  html, body { margin: 0; padding: 0; background: #f4f3ee; font-family: var(--font-sans); color: var(--fg); }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="iosScreens.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { IOSDevice } = window;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="entry" title="Entry & navigation" subtitle="Auth, conversation list, and the always-on bottom pill nav">
        <DCArtboard id="login" label="Login · magic link" width={402} height={874}>
          <IOSDevice><ScreenLogin /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="dmlist" label="DMs list" width={402} height={874}>
          <IOSDevice><ScreenDMList /></IOSDevice>
        </DCArtboard>
      </DCSection>
      <DCSection id="ios" title="Core surfaces" subtitle="Tree (outline), Twigl AI start, DM thread — design-system-aligned. The current iOS app uses systemGray + SF Symbols only; these versions apply the four-bar vocabulary + berries.">
        <DCArtboard id="tree" label="01 · Tree (outline)" width={402} height={874}>
          <IOSDevice>
            <ScreenTree />
          </IOSDevice>
        </DCArtboard>
        <DCArtboard id="twigl" label="02 · Twigl (AI start)" width={402} height={874}>
          <IOSDevice>
            <ScreenTwigl />
          </IOSDevice>
        </DCArtboard>
        <DCArtboard id="dm" label="03 · DM (thread)" width={402} height={874}>
          <IOSDevice>
            <ScreenDM />
          </IOSDevice>
        </DCArtboard>
      </DCSection>
      <DCSection id="detail" title="Detail surfaces" subtitle="Twig details (the leaf), AI conversation thread with bloom propose-tray">
        <DCArtboard id="details" label="Twig details · the leaf" width={402} height={874}>
          <IOSDevice><ScreenTwigDetails /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="aithread" label="Twigl · AI conversation" width={402} height={874}>
          <IOSDevice><ScreenAIThread /></IOSDevice>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
